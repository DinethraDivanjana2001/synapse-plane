services:
  # ── PostgreSQL database ──────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    container_name: synapse_db
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: synapse
      POSTGRES_DB: synapse_plane
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse -d synapse_plane"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── FastAPI backend ──────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: synapse_api
    environment:
      DATABASE_URL: postgresql+asyncpg://synapse:synapse@db:5432/synapse_plane
      APP_ENV: development
      LOG_LEVEL: INFO
      # Defaults to demo mode (safe: no live LLM/network calls) unless the
      # host shell sets DEMO_MODE=false for an explicit real-API test run.
      DEMO_MODE: "${DEMO_MODE:-true}"
      # Real Google Calendar requires DEMO_MODE=false too (see wiring.py) and
      # a one-time interactive `python scripts/setup_google_calendar_auth.py`
      # on the host — token.json/credentials.json are mounted below.
      CALENDAR_PROVIDER: "${CALENDAR_PROVIDER:-mock}"
      PLACES_PROVIDER: mock
      CORS_ORIGINS: "http://localhost:3000"
      # Optional — system uses fake planner if absent
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      SECRET_KEY: ${SECRET_KEY:-local-dev-secret-change-in-production}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src:ro
      - ./apps/api:/app/apps/api:ro
      - ./credentials.json:/app/credentials.json:ro
      # read-write: the token is refreshed and rewritten on expiry
      - ./token.json:/app/token.json
    command: >
      sh -c "alembic upgrade head &&
             python demo/seed.py &&
             uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── React frontend ───────────────────────────────────────────
  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
      # host networking during the npm install build step — BuildKit's
      # isolated build network hits ECONNRESET on this host's Docker Desktop/
      # WSL2 setup partway through large tarball downloads; host networking
      # avoids it entirely (verified: default build network fails reliably,
      # --network=host succeeds reliably)
      network: host
    container_name: synapse_web
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
    driver: local
