services:
  # ── PostgreSQL database ──────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    container_name: synapse_db
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: synapse
      POSTGRES_DB: synapse_plane
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse -d synapse_plane"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── FastAPI backend ──────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: synapse_api
    environment:
      DATABASE_URL: postgresql+asyncpg://synapse:synapse@db:5432/synapse_plane
      APP_ENV: development
      LOG_LEVEL: INFO
      DEMO_MODE: "true"
      CALENDAR_PROVIDER: mock
      PLACES_PROVIDER: mock
      CORS_ORIGINS: "http://localhost:3000"
      # Optional — system uses fake planner if absent
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      SECRET_KEY: ${SECRET_KEY:-local-dev-secret-change-in-production}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src:ro
      - ./apps/api:/app/apps/api:ro
    command: >
      sh -c "alembic upgrade head &&
             python demo/seed.py &&
             uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── React frontend ───────────────────────────────────────────
  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    container_name: synapse_web
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
    driver: local
