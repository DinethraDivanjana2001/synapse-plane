[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synapse-plane"
version = "0.1.0"
description = "A context-aware agentic execution plane with persistent memory, hybrid RAG, and human-governed workflow execution."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Dinethra Divanjana", email = "dinethra@example.com" }
]
keywords = ["agentic", "orchestration", "workflow", "ai", "llm"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Development Status :: 3 - Alpha",
]

dependencies = [
    # API framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # Validation and serialization
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",

    # Vector database (pgvector)
    "pgvector>=0.3.0",

    # Database
    "sqlalchemy>=2.0.35",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",

    # HTTP client (for remote agents / external providers)
    "httpx>=0.27.0",

    # Environment / config
    "python-dotenv>=1.0.0",

    # LLM provider
    "openai>=1.50.0",

    # Structured output helpers
    "tenacity>=9.0.0",

    # Utilities
    "python-ulid>=2.7.0",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "anyio>=4.6.0",

    # Linting and formatting
    "ruff>=0.6.0",

    # Type checking
    "mypy>=1.11.0",
    "types-python-dateutil>=2.9.0",
]

google-calendar = [
    "google-auth>=2.35.0",
    "google-auth-oauthlib>=1.2.0",
    "google-api-python-client>=2.149.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/synapse_plane"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--tb=short -q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "apps", "tests"]
# alembic revision files are auto-generated, not hand-formatted
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # unused function arguments
    "SIM",  # flake8-simplify
]
ignore = [
    "B008",  # do not perform function calls in argument defaults (FastAPI pattern)
    "ARG001", # unused function argument (sometimes needed for API compatibility)
]

[tool.ruff.lint.isort]
known-first-party = ["synapse_plane"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
strict = false
